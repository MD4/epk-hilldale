# Publishes the site to GitHub Pages on every push to main (or by hand from the Actions tab).
# It does nothing while the repository is private (GitHub Pages needs a public repo on the free plan).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Tells the build where the site is published: https://hilldale.band/ with the custom
      # domain set in Settings > Pages, https://md4.github.io/epk-hilldale/ without it.
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - name: Build the site, the PDFs and the press kit
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm run build
          node scripts/check-links.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # A separate job, as in GitHub's own Pages workflows: the upload has time to register
  # before the deploy asks for it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
